<style>

.btn.p:hover{background:var(--acH);transform:translateY(-1px);box-shadow:0 10px 22px rgba(var(--acr),.38)}.btn:hover{border-color:var(--ac)}

.st:last-child{border:0;padding:0}.st b{font-size:22px}

.chip{transition:background .2s,transform .15s,box-shadow .2s}.chip:hover{transform:translateY(-1px)}.chip.on{background:var(--tx);color:var(--on);border-color:var(--tx);box-shadow:0 4px 12px rgba(42,36,32,.2)}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.ev{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,border-color .15s}
.ev{transition:transform .28s cubic-bezier(.2,.7,.2,1),box-shadow .28s,border-color .28s}.ev:hover{transform:translateY(-5px);border-color:var(--ac);box-shadow:0 14px 30px rgba(var(--acr),.16)}
.post{height:128px;display:flex;align-items:flex-end;justify-content:space-between;padding:12px;color:#fff;position:relative}
.post .t{font-weight:800;font-size:22px;letter-spacing:-.01em;max-width:80%;line-height:1.1}
.post .tag{position:absolute;top:10px;left:10px;background:rgba(255,253,249,.92);color:#292722;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center}
.eb{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}

.logo{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800}
.ev h3{font-size:16px;line-height:1.3}

.meta{display:flex;flex-direction:column;gap:3px;color:var(--tx2);font-size:13px}
.meta span{display:flex;gap:8px;align-items:center}.meta svg{width:15px;height:15px}
.eb .btn{margin-top:auto;justify-content:center}
.cal{display:grid;grid-template-columns:1fr 300px;gap:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:var(--sh)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mg .h{font-size:12px;color:var(--tx2);font-weight:700;text-align:center;padding:4px}
.cell{min-height:84px;border:1px solid var(--bd);border-radius:10px;padding:5px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;background:var(--bg)}
.cell:hover{border-color:var(--ac)}.cell.sel{border-color:var(--ac2);background:var(--bg2)}.cell.td b{background:var(--ac2);color:var(--onac);border-radius:6px;padding:0 5px}.cell.o{opacity:.35}
.cell b{font-size:12px;align-self:flex-start}
.pill{font-size:11px;font-weight:600;border-radius:4px;padding:0 5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.li:last-child{border:0}.li .bar{width:4px;border-radius:2px;flex:none}
.modal{position:fixed;inset:0;background:rgba(41,39,34,.4);display:none;justify-content:center;align-items:flex-start;padding:5vh 16px;overflow:auto;z-index:20}
.modal.open{display:flex;animation:f .15s}
@keyframes f{from{opacity:0}}
.sheet{background:var(--card);border-radius:16px;max-width:640px;width:100%;overflow:hidden}
.sheet .post{height:180px}.sb{padding:22px;display:flex;flex-direction:column;gap:14px}
.x{position:absolute;top:10px;right:10px;background:rgba(255,253,249,.92);color:#292722;width:32px;height:32px;border-radius:8px;display:grid;place-items:center}

.f{display:flex;flex-direction:column;gap:5px}.f.w{grid-column:1/-1}
.f label{font-weight:700;font-size:13px}

.f .e{color:var(--er);font-size:12px;min-height:0}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--er)}
.gate{max-width:480px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:30;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.empty{padding:32px;border:1px dashed var(--ac);border-radius:14px;text-align:center;color:var(--tx2)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
@media(max-width:900px){aside{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%!important;height:auto;flex-direction:row;padding:6px;z-index:9;border-top:1px solid var(--bd);border-right:0;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
aside .lb,.brand,.sp,#col{display:none}.nav{flex-direction:column;gap:2px;font-size:11px;justify-content:center;align-items:center;padding:6px 2px}.nav .n{position:absolute;margin:0 0 14px 22px}
header{padding:12px 16px}.page{padding:20px 16px 110px}.hero,.cal{grid-template-columns:1fr}.av small,.av .nm{display:none}.seg button{padding:5px 8px}.cell{min-height:56px}.pill{display:none}h1{font-size:28px}form{grid-template-columns:1fr}}
.btn{transition:transform .15s,box-shadow .2s,background .2s,border-color .2s}.btn:active{transform:scale(.97)}
.btn.p::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);transition:transform .6s}.btn.p:hover::after{transform:translateX(120%)}
.nav{transition:background .2s,transform .2s}.nav:hover{transform:translateX(3px)}
.post{overflow:hidden}.post .t{position:relative}.post::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 0,rgba(255,255,255,.38),transparent 55%)}
.post::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-110%);transition:transform .7s}.ev:hover .post::after{transform:translateX(110%)}
.hero>.h2c{padding:20px}.mc{width:100%}.mc .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mg7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.mg7 .h{font-size:11px;font-weight:700;color:var(--tx2);padding:3px 0}
.md{aspect-ratio:1/.95;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:13px;transition:background .2s,transform .2s}.md:hover{background:var(--bg2);transform:scale(1.1)}
.md.td{background:var(--ac2);color:var(--onac);animation:pulse 2.4s infinite}.md .ds{display:flex;gap:2px;height:6px}.md .ds i{width:6px;height:6px;border-radius:50%;display:block}.md.td .ds i{box-shadow:0 0 0 1.5px #fff}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(var(--acr),.4)}50%{box-shadow:0 0 0 7px rgba(var(--acr),0)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}@keyframes pg{from{opacity:0;transform:translateY(8px)}}@keyframes pop{from{opacity:0;transform:scale(.96) translateY(12px)}}
.page.enter{animation:pg .4s cubic-bezier(.2,.7,.2,1)}.enter .ev,.enter .hero>div{animation:rise .55s cubic-bezier(.2,.7,.2,1) backwards}
.enter .ev:nth-child(2){animation-delay:.07s}.enter .ev:nth-child(3){animation-delay:.14s}.enter .ev:nth-child(4){animation-delay:.21s}.enter .ev:nth-child(5){animation-delay:.28s}.enter .ev:nth-child(n+6){animation-delay:.35s}.enter .hero>div:nth-child(2){animation-delay:.1s}
.modal.open .sheet{animation:pop .28s cubic-bezier(.2,.8,.2,1)}
body{background:radial-gradient(900px 420px at 100% 0,var(--g1) 0,transparent 65%),radial-gradient(700px 400px at 0 100%,var(--g2) 0,transparent 60%),var(--bg);background-attachment:fixed}
aside{background:linear-gradient(180deg,var(--as1),var(--as2))}
header{background:var(--hd);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.nav.on svg{color:var(--ac2)}.nav.on{box-shadow:var(--sh),inset 3px 0 0 var(--ac2)}
.hero>.h1{background:linear-gradient(135deg,var(--h1a) 0,var(--h1b) 100%);border:1px solid var(--bd);position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero>.h1::before{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);pointer-events:none}
.hero>.h1>*{position:relative}.hero>.h2c{box-shadow:var(--sh)}
.tdh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.tr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--rowbg);border:1px solid var(--bd);margin-bottom:8px;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.tr:hover{transform:translateX(4px);border-color:var(--ac);box-shadow:var(--sh)}
.tt{display:flex;flex-direction:column;min-width:48px;line-height:1.25}.tt b{font-size:15px}.tt small{color:var(--tx2);font-size:12px}
.tr .bar{width:4px;align-self:stretch;border-radius:2px}.ti{display:flex;flex-direction:column;flex:1;min-width:0}.ti b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bx{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--bg2);color:var(--tx2)}.bx.now{background:var(--ok);color:#fff}.bx.next{background:var(--ac2);color:var(--onac)}
form{max-width:900px}
.hero{grid-template-rows:520px}.hero>.h1{display:flex;flex-direction:column}.hero>.h1>.tdh{flex:none}
.tlist{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 8px 2px 2px;scrollbar-width:thin;scrollbar-color:var(--ac) transparent}
.tlist::-webkit-scrollbar{width:6px}.tlist::-webkit-scrollbar-thumb{background:var(--ac);border-radius:6px}
@media(max-width:900px){.hero{grid-template-rows:none}.tlist{flex:none;max-height:300px}}

.mr{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;box-shadow:var(--sh);transition:transform .2s,border-color .2s}.mr:hover{border-color:var(--ac);transform:translateY(-2px)}.mr .bar{width:4px;align-self:stretch;border-radius:2px}.mr .ti{cursor:pointer;flex:1}.mr .cat{font-size:12px;font-weight:700}@media(max-width:900px){.mr{flex-wrap:wrap}}

.h2c.club{position:relative;overflow:hidden;align-items:center;justify-content:center;cursor:pointer;background:radial-gradient(circle at 50% 40%,var(--cb) 0,var(--card) 70%)}
.club .halo{position:absolute;width:360px;height:360px;max-width:90%;aspect-ratio:1;border-radius:50%;filter:blur(46px);animation:spin 16s linear infinite,breathe 5s ease-in-out infinite;opacity:.8}
.club .sp{position:absolute;width:8px;height:8px;border-radius:50%;opacity:.8;animation:drift 6s ease-in-out infinite}
.club .mark{position:relative;animation:float 5.5s ease-in-out 1.6s infinite}
.club .sym{position:relative;width:100%}
.club .ly{position:absolute;inset:0;transform:translate3d(calc(var(--mx,0)*var(--d)*1px),calc(var(--my,0)*var(--d)*1px),0);transition:transform .25s ease-out}
.club .ly img{width:100%;height:100%;display:block;animation:fly .95s cubic-bezier(.2,1.25,.4,1) var(--dl,0s) backwards;filter:drop-shadow(0 8px 14px rgba(60,40,20,.12))}
.club .lt{position:relative;inset:auto;margin-left:auto;margin-right:auto}

.club .mono{display:flex;flex-direction:column;align-items:center;gap:14px}
.club .mono .ly{position:relative;inset:auto}.club .mono b{display:grid;place-items:center;width:130px;height:130px;border-radius:32px;color:#fff;font-size:44px;font-weight:800;animation:fly .95s cubic-bezier(.2,1.25,.4,1) backwards;box-shadow:0 14px 30px rgba(60,40,20,.2)}
.club .mt{font-weight:800;font-size:20px;animation:txt .9s .6s backwards}
@keyframes fly{from{opacity:0;transform:translate(var(--fx,0),var(--fy,0)) rotate(var(--fr,0)) scale(.55)}}
@keyframes txt{from{opacity:0;transform:translateY(16px);filter:blur(6px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{scale:.9}50%{scale:1.1}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(8px,-14px) scale(1.6);opacity:.35}}
.cn{background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c1));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 7s linear infinite}
@keyframes flow{to{background-position:-300% 0}}
@media(max-width:900px){.h2c.club{min-height:340px}}

:root{--on:#fff;--onac:#fff;--acr:232,89,12;--acH:#ff6a1a;--g1:#ffe8d0;--g2:#f8dcc4;--as1:#f1e5d5;--as2:#e9d9c6;--hd:rgba(245,237,228,.82);--h1a:#fffaf4;--h1b:#f6e8d6;--glow:rgba(255,154,82,.35);--rowbg:rgba(255,250,244,.9);--navh:rgba(255,253,249,.55);--cb:#fffdf9}

function generateCompleteUncroppedBanner(sourceImg){
  return new Promise((resolve, reject) => {
    const W = 1200, H = 675; // 16:9 Landscape standard
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    if(!ctx) return reject(new Error('Canvas 2D context not available'));

    const naturalW = sourceImg.naturalWidth || sourceImg.width;
    const naturalH = sourceImg.naturalHeight || sourceImg.height;

    // 1. Ambient Blurred Backdrop that fills the full 16:9 width
    const bgScale = Math.max(W / naturalW, H / naturalH);
    const bgW = naturalW * bgScale;
    const bgH = naturalH * bgScale;
    const bgX = (W - bgW) / 2;
    const bgY = (H - bgH) / 2;

    ctx.save();
    try {
      if('filter' in ctx) ctx.filter = 'blur(35px) brightness(0.65)';
    } catch(x){}
    ctx.drawImage(sourceImg, bgX - 20, bgY - 20, bgW + 40, bgH + 40);
    ctx.restore();

    // Dark vignette overlay on backdrop for contrast
    const vigGrad = ctx.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, W / 1.5);
    vigGrad.addColorStop(0, 'rgba(0, 0, 0, 0.25)');
    vigGrad.addColorStop(1, 'rgba(0, 0, 0, 0.7)');
    ctx.fillStyle = vigGrad;
    ctx.fillRect(0, 0, W, H);

    // 2. The Complete, 100% Uncropped Poster
    // Scale poster to fit banner height with padding
    const targetH = H - 24; // 12px top and bottom margin
    const scale = targetH / naturalH;
    const posterW = Math.round(naturalW * scale);
    const posterH = targetH;
    const posterX = Math.round((W - posterW) / 2);
    const posterY = 12;

    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
    ctx.shadowBlur = 30;
    ctx.shadowOffsetY = 6;
    ctx.drawImage(sourceImg, posterX, posterY, posterW, posterH);
    ctx.restore();

    const dataUrl = canvas.toDataURL('image/jpeg', 0.94);
    canvas.toBlob(blob => {
      resolve({ dataUrl, blob, width: W, height: H });
    }, 'image/jpeg', 0.94);
  });
}

function formatBannerTime(s, e){
  if(!s) return '6:30 PM Onwards';
  const parseT = t => {
    if(!t) return '';
    const [h,m] = t.split(':').map(Number);
    const ampm = h >= 12 ? 'PM' : 'AM';
    const hr = h % 12 || 12;
    return hr + (m ? ':' + String(m).padStart(2,'0') : ':00') + ' ' + ampm;
  };
  const st = parseT(s);
  const et = parseT(e);
  if(et) return st + ' - ' + et;
  return st + ' Onwards';
}
function getOrdinal(d){

  }
}
function generateRecomposedBanner(sourceImg, customMeta = {}){
  return new Promise((resolve, reject) => {
    const W = 1200, H = 675; // Standard 16:9 Landscape Banner
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    if(!ctx) return reject(new Error('Canvas 2D context not available'));

    // Extract ambient colors from source image corners
    let cTop = [4, 7, 20], cMid = [47, 123, 255];
    try {
      const sCan = document.createElement('canvas');
      sCan.width = sourceImg.naturalWidth || sourceImg.width || 600;
      sCan.height = sourceImg.naturalHeight || sourceImg.height || 800;
      const sCtx = sCan.getContext('2d');
      sCtx.drawImage(sourceImg, 0, 0);
      const d1 = sCtx.getImageData(Math.min(20, sCan.width - 1), Math.min(20, sCan.height - 1), 1, 1).data;
      const d2 = sCtx.getImageData(Math.max(1, sCan.width - 20), Math.round(sCan.height * 0.4), 1, 1).data;
      cTop = [d1[0], d1[1], d1[2]];
      cMid = [d2[0], d2[1], d2[2]];
    } catch(e) {}

    const colBack = `rgb(${cTop[0]}, ${cTop[1]}, ${cTop[2]})`;
    const accentCol = customMeta.cat === 'ru' ? '#E5484D' : (customMeta.cat === 'cl' ? '#12B76A' : '#2F7BFF');

    // 1. Dark ambient background gradient
    const bgGrad = ctx.createLinearGradient(0, 0, W, H);
    bgGrad.addColorStop(0, '#040714');
    bgGrad.addColorStop(0.38, colBack);
    bgGrad.addColorStop(1, '#050918');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // 2. Vibrant ambient glow behind the subject on the right
    const radGrad = ctx.createRadialGradient(880, 320, 40, 880, 320, 480);
    radGrad.addColorStop(0, `rgba(${cMid[0]}, ${cMid[1]}, ${cMid[2]}, 0.5)`);
    radGrad.addColorStop(0.55, 'rgba(18, 45, 120, 0.22)');
    radGrad.addColorStop(1, 'rgba(4, 7, 20, 0)');
    ctx.fillStyle = radGrad;
    ctx.fillRect(0, 0, W, H);

    // 3. Subject / Artwork on the right
    const naturalW = sourceImg.naturalWidth || sourceImg.width;
    const naturalH = sourceImg.naturalHeight || sourceImg.height;
    const isPortrait = naturalH >= naturalW;

    if (isPortrait) {
      // Scale poster to fit 100% of banner height without any vertical cropping
      const scale = H / naturalH;
      const scaledW = Math.round(naturalW * scale);
      const scaledH = H;
      const posX = W - scaledW;

      const subCan = document.createElement('canvas');
      subCan.width = W;
      subCan.height = H;
      const subCtx = subCan.getContext('2d');
      // Draw the full uncropped poster from top (y=0) to bottom (y=H)
      subCtx.drawImage(sourceImg, posX, 0, scaledW, scaledH);

      // Subtle, soft alpha fade only on the outer left edge of the poster
      subCtx.globalCompositeOperation = 'destination-out';
      const maskGrad = subCtx.createLinearGradient(posX - 10, 0, posX + Math.round(scaledW * 0.22), 0);
      maskGrad.addColorStop(0, 'rgba(0, 0, 0, 1)');
      maskGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      subCtx.fillStyle = maskGrad;
      subCtx.fillRect(0, 0, W, H);

      ctx.drawImage(subCan, 0, 0);
    } else {
      const scale = Math.max(W / naturalW, H / naturalH);
      const sw = naturalW * scale, sh = naturalH * scale;
      const sx = (W - sw) / 2, sy = (H - sh) / 2;
      ctx.drawImage(sourceImg, sx, sy, sw, sh);
      const overGrad = ctx.createLinearGradient(0, 0, W * 0.65, 0);
      overGrad.addColorStop(0, 'rgba(4, 7, 20, 0.95)');
      overGrad.addColorStop(0.7, 'rgba(4, 7, 20, 0.7)');
      overGrad.addColorStop(1, 'rgba(4, 7, 20, 0)');
      ctx.fillStyle = overGrad;
      ctx.fillRect(0, 0, W, H);
    }

    // 4. Left Column: Brand & Header
    const clubName = (customMeta.club || 'CAMPUS EVENT').toUpperCase();
    const finalAccent = customMeta.accent_color || accentCol;
    ctx.fillStyle = finalAccent;
    ctx.font = '900 26px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillText(clubName, 60, 85);

    const clubW = ctx.measureText(clubName).width;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.fillRect(60 + clubW + 16, 67, 2, 20);

    ctx.fillStyle = '#94A3B8';
    ctx.font = '500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillText('Create · Innovate · Elevate', 60 + clubW + 30, 83);

    // 5. Main Title (Massive & Punchy, multi-line)
    const rawTitle = customMeta.title || "CAMPUS EVENT";
    const words = rawTitle.toUpperCase().split(/\s+/).filter(Boolean);
    let lines = [];
    if (words.length <= 3) {
      lines = words;
    } else if (words.length <= 6) {
      lines = [
        words.slice(0, Math.ceil(words.length / 2)).join(' '),
        words.slice(Math.ceil(words.length / 2)).join(' ')
      ];
    } else {
      lines = [
        words.slice(0, 3).join(' '),
        words.slice(3, 6).join(' '),
        words.slice(6, 9).join(' ')
      ];
    }

    const fontSize = lines.length >= 3 ? 56 : (lines.length === 2 ? 64 : 70);
    ctx.font = `900 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
    let curY = 195;
    lines.forEach((line, idx) => {
      ctx.fillStyle = (idx === 1 && lines.length > 1) ? finalAccent : '#FFFFFF';
      ctx.fillText(line, 60, curY);
      curY += fontSize + 12;
    });

    // 6. Subtitle / Description
    const desc = customMeta.desc || customMeta.subtitle || (customMeta.speaker ? 'Speaker: ' + customMeta.speaker : '') || 'Join us for this exciting campus session.';
    ctx.fillStyle = '#CBD5E1';
    ctx.font = '500 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    const descWords = desc.split(' ');
    let dLine = '', dLines = [];
    for (let n = 0; n < descWords.length; n++) {
      const testLine = dLine + descWords[n] + ' ';
      if (ctx.measureText(testLine).width > 480 && n > 0) {
        dLines.push(dLine.trim());
        dLine = descWords[n] + ' ';
        if (dLines.length === 2) { dLines[1] += '...'; break; }
      } else {
        dLine = testLine;
      }
    }
    if (dLine && dLines.length < 2) dLines.push(dLine.trim());
    dLines.forEach((dl, i) => {
      ctx.fillText(dl, 60, curY + 6 + (i * 28));
    });

    // 7. Pills: Venue & Time (Safely placed with ample bottom margin)
    function drawPill(x, y, w, h, icon, label, val) {
      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.strokeStyle = 'rgba(47, 123, 255, 0.4)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 20);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#64748B';
      ctx.font = '600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.fillText(label, x + 36, y + 21);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.fillText(val, x + 36, y + 41);
      ctx.restore();
    }

    const venueVal = customMeta.room || customMeta.venue || 'Campus Venue';
    const timeVal = customMeta.time || formatBannerTime(customMeta.s, customMeta.e) || '6:30 PM Onwards';
    drawPill(60, 530, 210, 58, '📍', 'Venue', venueVal);
    drawPill(285, 530, 240, 58, '🕒', 'Time', timeVal);

    // 8. Date Badge (Bottom Right, safely padded)
    let dayNum = 21, monthStr = 'OCT';
    if (customMeta.day) {
      dayNum = parseInt(customMeta.day) || 21;
      monthStr = (customMeta.month || 'OCT').toUpperCase();
    } else if (customMeta.date) {
      const dtObj = new Date(customMeta.date + 'T00:00:00');
      if (!isNaN(dtObj.getTime())) {
        dayNum = dtObj.getDate();
        monthStr = dtObj.toLocaleDateString('en-US', { month: 'short' }).toUpperCase();
      }
    } else if (customMeta.d) {
      dayNum = customMeta.d;
      monthStr = 'NOV';
    }

    const ord = getOrdinal(dayNum);
    ctx.save();
    ctx.textAlign = 'right';
    ctx.fillStyle = finalAccent;
    ctx.font = '900 72px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillText(String(dayNum), 1140, 545);

    ctx.font = '700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillText(ord, 1165, 502);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '900 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillText(monthStr, 1140, 595);
    ctx.restore();

    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    canvas.toBlob(blob => {
      resolve({ dataUrl, blob, width: W, height: H });
    }, 'image/jpeg', 0.92);
  });
}

async function handlePosterUpload(file){
  if(!file)return;
  if(!/^image\/(png|jpeg)$/.test(file.type)){
    setErr('poster','Please select a JPG or PNG image');
    return;
  }
  if(file.size > 5242880){
    setErr('poster','Image must be under 5 MB');
    return;
  }
  setErr('poster','');
  const info=$('#poster-file-info');
  if(info) info.innerHTML='<span style="color:var(--p)">⏳ Processing poster and generating 16:9 banner...</span>';
  try{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = async () => {
        currentPosterImage = img;
        currentOriginalPosterData = e.target.result;
        currentBannerApplied = true;

        // 1. Try AI banner generation via OpenRouter
        let aiBannerUrl = null;
        try {
          const aiRes = await generateBannerWithOpenRouter(e.target.result);
          if (aiRes && aiRes.ok && aiRes.imageUrl) {
            aiBannerUrl = aiRes.imageUrl;
          }
        } catch(x){}

        let resDataUrl = null;
        let resBlob = null;

        if (aiBannerUrl) {
          resDataUrl = aiBannerUrl;
        } else {
          // 2. Generate 100% complete, uncropped 16:9 banner (no cutouts, no duplicate text)
          const res = await generateCompleteUncroppedBanner(img);
          resDataUrl = res.dataUrl;
          resBlob = res.blob;
        }

        currentBannerData = resDataUrl;
        currentBannerBlob = resBlob;

        const preview = $('#poster-banner-preview');
        if(preview){
          preview.style.display = 'block';
          const pImg = $('#banner-preview-img');
          if(pImg) pImg.src = resDataUrl;
          updateBannerChoiceUI();
        }
        if(info) info.innerHTML = '<b>' + file.name + '</b> (' + Math.round(file.size/1024) + ' KB) · <span style="color:#26805A;font-weight:600">✨ 16:9 Banner Ready (100% Uncropped)</span>';
        toast('✨ 16:9 banner created: 100% complete & uncropped!');
      };
      img.onerror = () => {
        if(info) info.textContent = 'Failed to load image.';
        setErr('poster','Could not load image file');
      };
      img.src = e.target.result;
    };
    reader.onerror = () => {
      if(info) info.textContent = 'Failed to read file.';
      setErr('poster','Could not read file');
    };
    reader.readAsDataURL(file);
  }catch(err){
    console.error('Banner conversion failed:', err);
    if(info) info.textContent = 'Conversion failed. Please try another image.';
    setErr('poster','Could not convert image to banner');
  }
}
